version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
      environment:
        variables:
          NEXT_PUBLIC_WEBSOCKET_ORIGIN: "wss://your-websocket-server.example.com"
