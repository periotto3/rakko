<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Babanuki Debug Client</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }

  /* Header */
  .header { padding: 12px 20px; background: #16213e; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #0f3460; }
  .header h1 { font-size: 18px; white-space: nowrap; }
  .header input { flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid #0f3460; background: #1a1a2e; color: #eee; font-size: 14px; }
  .header input::placeholder { color: #666; }

  /* Grid */
  .grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; padding: 8px; height: calc(100vh - 53px); }

  /* Panel */
  .panel { background: #16213e; border-radius: 8px; border: 1px solid #0f3460; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
  .panel.my-turn { border-color: #e94560; box-shadow: 0 0 12px rgba(233, 69, 96, 0.3); }
  .panel.finished { opacity: 0.6; }

  .panel-header { padding: 10px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #0f3460; flex-shrink: 0; }
  .panel-header .seat { font-size: 20px; }
  .panel-header input { flex: 1; padding: 6px 10px; border-radius: 4px; border: 1px solid #0f3460; background: #1a1a2e; color: #eee; font-size: 13px; }
  .panel-header button { padding: 6px 14px; border-radius: 4px; border: none; background: #e94560; color: #fff; cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .panel-header button:hover { background: #c73e54; }
  .panel-header button:disabled { background: #555; cursor: not-allowed; }
  .panel-header button.connected { background: #2ecc71; }
  .panel-header button.disconnect { background: #e67e22; }

  .panel-status { padding: 6px 12px; font-size: 12px; color: #aaa; border-bottom: 1px solid #0f3460; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .panel-status .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge-waiting { background: #f39c12; color: #000; }
  .badge-playing { background: #2ecc71; color: #000; }
  .badge-finished { background: #9b59b6; color: #fff; }
  .badge-disconnected { background: #555; color: #ccc; }

  /* Hand area */
  .hand-area { padding: 8px 12px; flex-shrink: 0; }
  .hand-label { font-size: 11px; color: #888; margin-bottom: 4px; }
  .hand { display: flex; flex-wrap: wrap; gap: 4px; min-height: 46px; }

  .card { width: 38px; height: 52px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; line-height: 1.1; text-align: center; border: 1px solid #444; flex-shrink: 0; }
  .card-front { background: #fff; cursor: default; }
  .card-front.spades, .card-front.clubs { color: #222; }
  .card-front.hearts, .card-front.diamonds { color: #e94560; }
  .card-front.joker { color: #9b59b6; background: #f0e6f6; }
  .card-back { background: linear-gradient(135deg, #3498db, #2980b9); color: #fff; font-size: 16px; cursor: pointer; transition: transform 0.1s; }
  .card-back:hover { transform: scale(1.1); background: linear-gradient(135deg, #e94560, #c0392b); }
  .card-back.disabled { cursor: not-allowed; opacity: 0.5; }
  .card-back.disabled:hover { transform: none; background: linear-gradient(135deg, #3498db, #2980b9); }

  /* Other players in this panel */
  .others-area { padding: 4px 12px 8px; flex-shrink: 0; }
  .other-player { margin-bottom: 4px; }
  .other-player-label { font-size: 11px; color: #888; margin-bottom: 2px; }
  .other-player-label .turn-indicator { color: #e94560; font-weight: 700; }
  .other-player-label .done-indicator { color: #2ecc71; }

  /* Log */
  .log-area { flex: 1; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid #0f3460; }
  .log-label { font-size: 11px; color: #888; padding: 4px 12px; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; }
  .log-label button { font-size: 10px; background: none; border: 1px solid #555; color: #888; border-radius: 3px; padding: 1px 6px; cursor: pointer; }
  .log { flex: 1; overflow-y: auto; padding: 0 12px 8px; font-size: 11px; font-family: 'SF Mono', 'Fira Code', monospace; }
  .log-entry { padding: 2px 0; border-bottom: 1px solid #0f346020; word-break: break-all; }
  .log-entry.sent { color: #3498db; }
  .log-entry.received { color: #2ecc71; }
  .log-entry.error { color: #e94560; }
  .log-entry .ts { color: #555; }

  /* Rankings overlay */
  .rankings { padding: 8px 12px; background: #1a1a2e; border-top: 1px solid #0f3460; flex-shrink: 0; }
  .rankings h3 { font-size: 13px; margin-bottom: 4px; color: #f39c12; }
  .ranking-entry { font-size: 12px; padding: 2px 0; }
  .ranking-entry .medal { margin-right: 4px; }

  /* Get State button */
  .action-bar { padding: 4px 12px; flex-shrink: 0; display: flex; gap: 6px; }
  .action-bar button { padding: 4px 10px; border-radius: 4px; border: 1px solid #0f3460; background: #1a1a2e; color: #aaa; cursor: pointer; font-size: 11px; }
  .action-bar button:hover { background: #0f3460; color: #eee; }

  /* Roulette slots */
  .roulette-area { padding: 8px 12px; flex-shrink: 0; }
  .roulette-label { font-size: 11px; color: #888; margin-bottom: 4px; }
  .roulette-slots { display: flex; gap: 6px; flex-wrap: wrap; }
  .roulette-slot { padding: 4px 8px; border-radius: 4px; font-size: 12px; border: 1px solid #0f3460; background: #1a1a2e; }
  .roulette-slot.decided { background: #0f3460; color: #fff; }
  .roulette-slot.new { background: #e94560; color: #fff; animation: slotPulse 0.6s ease-in-out; }
  .roulette-slot.pending { color: #555; border-style: dashed; }
  .roulette-slot.spinning { background: #2c2c4a; color: #ddd; border-color: #e94560; animation: spinGlow 0.3s ease-in-out infinite alternate; }
  @keyframes slotPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  @keyframes spinGlow { 0% { border-color: #e94560; text-shadow: 0 0 4px rgba(233,69,96,0.5); } 100% { border-color: #f39c12; text-shadow: 0 0 4px rgba(243,156,18,0.5); } }

  /* Generating / Images */
  .generating-area { padding: 8px 12px; flex-shrink: 0; }
  .generating-spinner { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #f39c12; }
  .generating-spinner::before { content: ''; width: 16px; height: 16px; border: 2px solid #f39c12; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .image-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 6px; }
  .image-gallery img { width: 100%; border-radius: 4px; border: 1px solid #0f3460; }
  .image-gallery .error { width: 100%; padding: 12px; border-radius: 4px; border: 1px solid #e94560; background: #2c1a1a; color: #e94560; font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <h1>🃏 Babanuki Debug</h1>
  <input type="text" id="ws-url" placeholder="wss://xxxxxxxxxx.execute-api.ap-northeast-1.amazonaws.com/prod">
</div>
<div class="grid" id="grid"></div>

<script>
const PANEL_COUNT = 4;
const DEFAULT_NAMES = ['Alice', 'Bob', 'Charlie', 'Diana'];
const SUIT_SYMBOLS = { spades: '♠', hearts: '♥', diamonds: '♦', clubs: '♣', joker: '🃏' };
const MEDALS = ['🥇', '🥈', '🥉', '💀'];
const SLOT_LABELS = { who: 'だれが', when: 'いつ', where: 'どこで', what: 'なにを' };

class PlayerPanel {
  constructor(index) {
    this.index = index;
    this.ws = null;
    this.state = 'disconnected'; // disconnected | waiting | playing | finished
    this.seatIndex = null;
    this.hand = [];
    this.players = [];
    this.currentTurnSeat = -1;
    this.rankings = null;
    this.drawTargetSeat = null;
    this.spinIntervals = {};   // key -> intervalId for spinning slots
    this.slotCandidates = {};  // key -> string[] from server
    this.buildDOM();
  }

  buildDOM() {
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.id = `panel-${this.index}`;

    panel.innerHTML = `
      <div class="panel-header">
        <span class="seat">P${this.index + 1}</span>
        <input type="text" placeholder="Player name" value="${DEFAULT_NAMES[this.index]}">
        <button class="join-btn">Join</button>
      </div>
      <div class="panel-status">
        <span class="status-text">Disconnected</span>
        <span class="badge badge-disconnected">--</span>
      </div>
      <div class="roulette-area" style="display:none;">
        <div class="roulette-label">Theme Roulette</div>
        <div class="roulette-slots"></div>
      </div>
      <div class="generating-area" style="display:none;"></div>
      <div class="hand-area">
        <div class="hand-label">My Hand</div>
        <div class="hand my-hand"></div>
      </div>
      <div class="others-area"></div>
      <div class="action-bar">
        <button class="get-state-btn" disabled>Get State</button>
      </div>
      <div class="rankings-container"></div>
      <div class="log-area">
        <div class="log-label">
          <span>Log</span>
          <button class="clear-log-btn">Clear</button>
        </div>
        <div class="log"></div>
      </div>
    `;

    this.el = panel;
    this.nameInput = panel.querySelector('input');
    this.joinBtn = panel.querySelector('.join-btn');
    this.statusText = panel.querySelector('.status-text');
    this.badge = panel.querySelector('.badge');
    this.myHand = panel.querySelector('.my-hand');
    this.othersArea = panel.querySelector('.others-area');
    this.getStateBtn = panel.querySelector('.get-state-btn');
    this.rankingsContainer = panel.querySelector('.rankings-container');
    this.rouletteArea = panel.querySelector('.roulette-area');
    this.rouletteSlotsEl = panel.querySelector('.roulette-slots');
    this.generatingArea = panel.querySelector('.generating-area');
    this.logEl = panel.querySelector('.log');
    this.clearLogBtn = panel.querySelector('.clear-log-btn');

    this.joinBtn.addEventListener('click', () => this.toggleConnection());
    this.getStateBtn.addEventListener('click', () => this.sendGetState());
    this.clearLogBtn.addEventListener('click', () => { this.logEl.innerHTML = ''; });

    document.getElementById('grid').appendChild(panel);
  }

  toggleConnection() {
    if (this.ws && this.ws.readyState <= 1) {
      this.ws.close();
      return;
    }
    this.connect();
  }

  connect() {
    const url = document.getElementById('ws-url').value.trim();
    if (!url) { alert('Enter WebSocket URL'); return; }
    const name = this.nameInput.value.trim();
    if (!name) { alert('Enter player name'); return; }

    this.log('Connecting...', 'sent');
    this.joinBtn.disabled = true;

    try {
      this.ws = new WebSocket(url);
    } catch (e) {
      this.log(`Connection error: ${e.message}`, 'error');
      this.joinBtn.disabled = false;
      return;
    }

    this.ws.addEventListener('open', () => {
      this.log('Connected. Sending join...', 'sent');
      this.joinBtn.disabled = false;
      this.joinBtn.textContent = 'Disconnect';
      this.joinBtn.classList.add('disconnect');
      this.nameInput.disabled = true;
      this.getStateBtn.disabled = false;
      this.send({ action: 'join', playerName: name });
    });

    this.ws.addEventListener('message', (ev) => {
      this.handleMessage(ev.data);
    });

    this.ws.addEventListener('close', () => {
      this.log('Disconnected', 'error');
      this.resetUI();
    });

    this.ws.addEventListener('error', () => {
      this.log('WebSocket error', 'error');
    });
  }

  send(data) {
    if (!this.ws || this.ws.readyState !== 1) return;
    const json = JSON.stringify(data);
    this.ws.send(json);
    this.log(`→ ${json}`, 'sent');
  }

  handleMessage(raw) {
    this.log(`← ${raw}`, 'received');
    let msg;
    try { msg = JSON.parse(raw); } catch { return; }

    switch (msg.type) {
      case 'waiting':
        this.state = 'waiting';
        if (msg.slotCandidates) this.slotCandidates = msg.slotCandidates;
        this.updateStatus(`Waiting (${msg.waitingCount}/4)`, 'waiting');
        this.renderRoulette(msg.decidedSlots || [], msg.newSlot);
        break;

      case 'game_start':
        Object.values(this.spinIntervals).forEach(id => clearInterval(id));
        this.spinIntervals = {};
        this.state = 'playing';
        this.seatIndex = msg.yourSeatIndex;
        this.hand = msg.yourHand;
        this.players = msg.players;
        this.currentTurnSeat = msg.currentTurnSeat;
        this.rankings = null;
        this.updateStatus(`Playing - Seat ${this.seatIndex}`, 'playing');
        this.renderGame();
        break;

      case 'game_state':
        if (msg.phase === 'finished') {
          this.state = 'finished';
          this.updateStatus('Finished', 'finished');
        } else {
          this.state = 'playing';
          this.updateStatus(`Playing - Seat ${this.seatIndex}`, 'playing');
        }
        this.hand = msg.yourHand;
        this.players = msg.players;
        this.currentTurnSeat = msg.currentTurnSeat;
        this.renderGame();
        break;

      case 'card_drawn': {
        const drawer = this.players.find(p => p.seatIndex === msg.drawerSeat);
        const target = this.players.find(p => p.seatIndex === msg.targetSeat);
        const dn = drawer ? drawer.name : `Seat ${msg.drawerSeat}`;
        const tn = target ? target.name : `Seat ${msg.targetSeat}`;
        this.log(`  ${dn} drew from ${tn} — ${msg.paired ? 'PAIR! ✨' : 'No pair'}`, 'received');
        break;
      }

      case 'game_over':
        this.state = 'finished';
        this.rankings = msg.rankings;
        this.updateStatus('Game Over', 'finished');
        this.renderRankings();
        this.el.classList.add('finished');
        setTimeout(() => { if (this.ws) this.ws.close(); }, 3000);
        break;

      case 'generating':
        this.generatingArea.style.display = '';
        this.generatingArea.innerHTML = '<div class="generating-spinner">Generating images...</div>';
        this.updateStatus('Generating images...', 'waiting');
        break;

      case 'images_ready': {
        this.generatingArea.style.display = '';
        this.generatingArea.innerHTML = '';
        const urls = msg.imageUrls || [];
        if (urls.length === 0) {
          this.generatingArea.innerHTML = '<div style="padding:8px;color:#e94560;font-size:13px;">画像の生成に失敗しました</div>';
        } else {
          const gallery = document.createElement('div');
          gallery.className = 'image-gallery';
          urls.forEach(url => {
            const img = document.createElement('img');
            img.src = url;
            img.alt = 'Generated image';
            img.onerror = function() {
              const err = document.createElement('div');
              err.className = 'error';
              err.textContent = '⚠ Load failed';
              this.replaceWith(err);
            };
            gallery.appendChild(img);
          });
          this.generatingArea.appendChild(gallery);
        }
        this.updateStatus('Images ready', 'playing');
        break;
      }

      case 'error':
        this.log(`ERROR: ${msg.message}`, 'error');
        break;
    }
  }

  updateStatus(text, type) {
    this.statusText.textContent = text;
    this.badge.className = `badge badge-${type}`;
    this.badge.textContent = type === 'waiting' ? '⏳' : type === 'playing' ? '🎮' : type === 'finished' ? '🏁' : '--';
  }

  renderGame() {
    this.renderMyHand();
    this.renderOthers();
    this.updateTurnHighlight();
  }

  renderMyHand() {
    this.myHand.innerHTML = '';
    if (!this.hand.length) {
      this.myHand.innerHTML = '<span style="color:#888;font-size:12px;">No cards (finished!)</span>';
      return;
    }
    this.hand.forEach(card => {
      const el = document.createElement('div');
      el.className = `card card-front ${card.suit}`;
      el.innerHTML = `${SUIT_SYMBOLS[card.suit] || ''}<br>${card.label}`;
      el.title = card.id;
      this.myHand.appendChild(el);
    });
  }

  renderOthers() {
    this.othersArea.innerHTML = '';
    if (!this.players.length) return;

    // Determine draw target: next player clockwise with cards
    this.drawTargetSeat = null;
    if (this.currentTurnSeat === this.seatIndex && this.state === 'playing') {
      const myIdx = this.players.findIndex(p => p.seatIndex === this.seatIndex);
      if (myIdx !== -1) {
        let next = (myIdx + 1) % this.players.length;
        for (let i = 0; i < this.players.length; i++) {
          if (this.players[next].cardCount > 0 && this.players[next].seatIndex !== this.seatIndex) {
            this.drawTargetSeat = this.players[next].seatIndex;
            break;
          }
          next = (next + 1) % this.players.length;
        }
      }
    }

    this.players.forEach(p => {
      if (p.seatIndex === this.seatIndex) return;

      const div = document.createElement('div');
      div.className = 'other-player';

      const isTarget = this.drawTargetSeat === p.seatIndex;
      const isTurn = this.currentTurnSeat === p.seatIndex;
      const isDone = p.finishedOrder !== null;

      let labelHTML = `${p.avatar} ${p.name} (${p.cardCount} cards)`;
      if (isTurn) labelHTML += ' <span class="turn-indicator">◀ TURN</span>';
      if (isDone) labelHTML += ` <span class="done-indicator">Done #${p.finishedOrder}</span>`;
      if (isTarget) labelHTML += ' <span class="turn-indicator">← Draw from here</span>';

      const label = document.createElement('div');
      label.className = 'other-player-label';
      label.innerHTML = labelHTML;
      div.appendChild(label);

      const hand = document.createElement('div');
      hand.className = 'hand';
      hand.style.marginLeft = '4px';

      for (let i = 0; i < p.cardCount; i++) {
        const cardEl = document.createElement('div');
        cardEl.className = `card card-back${isTarget ? '' : ' disabled'}`;
        cardEl.textContent = '?';
        if (isTarget) {
          const idx = i;
          cardEl.addEventListener('click', () => this.drawCard(idx));
        }
        hand.appendChild(cardEl);
      }
      div.appendChild(hand);
      this.othersArea.appendChild(div);
    });
  }

  updateTurnHighlight() {
    const isMyTurn = this.currentTurnSeat === this.seatIndex && this.state === 'playing';
    this.el.classList.toggle('my-turn', isMyTurn);
    this.el.classList.toggle('finished', this.state === 'finished');
  }

  drawCard(cardIndex) {
    this.send({ action: 'draw_card', cardIndex });
  }

  sendGetState() {
    this.send({ action: 'get_state' });
  }

  renderRankings() {
    if (!this.rankings) return;
    this.rankingsContainer.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'rankings';
    div.innerHTML = '<h3>Rankings</h3>';
    this.rankings.forEach(r => {
      const entry = document.createElement('div');
      entry.className = 'ranking-entry';
      entry.innerHTML = `<span class="medal">${MEDALS[r.rank - 1] || `#${r.rank}`}</span>${r.avatar} ${r.name}`;
      div.appendChild(entry);
    });
    this.rankingsContainer.appendChild(div);
  }

  renderRoulette(decidedSlots, newSlot) {
    this.rouletteArea.style.display = '';
    // DOM再構築前に全intervalをクリア
    Object.values(this.spinIntervals).forEach(id => clearInterval(id));
    this.spinIntervals = {};
    this.rouletteSlotsEl.innerHTML = '';
    const allKeys = ['who', 'when', 'where', 'what'];

    allKeys.forEach(key => {
      const slot = decidedSlots.find(s => s.key === key);
      const el = document.createElement('span');
      el.dataset.key = key;

      if (slot) {
        // This slot is decided — stop any spin and show confirmed value
        if (this.spinIntervals[key]) {
          clearInterval(this.spinIntervals[key]);
          delete this.spinIntervals[key];
        }
        const isNew = newSlot && newSlot.key === key;
        el.className = `roulette-slot ${isNew ? 'new' : 'decided'}`;
        el.textContent = `${SLOT_LABELS[key]}: ${slot.value}`;
      } else {
        // Pending slot — start spinning if candidates available and not already spinning
        el.className = 'roulette-slot spinning';
        const candidates = this.slotCandidates[key];
        if (candidates && candidates.length > 0) {
          el.textContent = `${SLOT_LABELS[key]}: ${candidates[0]}`;
          let idx = 0;
          this.spinIntervals[key] = setInterval(() => {
            idx = (idx + 1) % candidates.length;
            el.textContent = `${SLOT_LABELS[key]}: ${candidates[idx]}`;
          }, 50);
        } else {
          el.textContent = `${SLOT_LABELS[key]}: ???`;
        }
      }
      this.rouletteSlotsEl.appendChild(el);
    });
  }

  log(text, type = '') {
    const entry = document.createElement('div');
    entry.className = `log-entry ${type}`;
    const ts = new Date().toLocaleTimeString('ja-JP', { hour12: false });
    entry.innerHTML = `<span class="ts">[${ts}]</span> ${this.escapeHtml(text)}`;
    this.logEl.appendChild(entry);
    this.logEl.scrollTop = this.logEl.scrollHeight;
  }

  escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  resetUI() {
    // Clear all spin intervals
    Object.values(this.spinIntervals).forEach(id => clearInterval(id));
    this.spinIntervals = {};
    this.slotCandidates = {};
    this.ws = null;
    this.state = 'disconnected';
    this.seatIndex = null;
    this.hand = [];
    this.players = [];
    this.currentTurnSeat = -1;
    this.rankings = null;
    this.joinBtn.textContent = 'Join';
    this.joinBtn.disabled = false;
    this.joinBtn.classList.remove('disconnect');
    this.nameInput.disabled = false;
    this.getStateBtn.disabled = true;
    this.myHand.innerHTML = '';
    this.othersArea.innerHTML = '';
    this.rankingsContainer.innerHTML = '';
    this.rouletteArea.style.display = 'none';
    this.rouletteSlotsEl.innerHTML = '';
    this.generatingArea.style.display = 'none';
    this.generatingArea.innerHTML = '';
    this.updateStatus('Disconnected', 'disconnected');
    this.el.classList.remove('my-turn', 'finished');
  }
}

// Initialize panels
const panels = [];
for (let i = 0; i < PANEL_COUNT; i++) {
  panels.push(new PlayerPanel(i));
}
</script>
</body>
</html>
